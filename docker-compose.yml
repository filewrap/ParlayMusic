# Parlay — docker-compose.yml
#
# The 2-process engine (FINAL-ARCHITECTURE.md): the Go unified
# backend + the C++ core, talking over one persistent UDS socket in
# the shared data volume. No inter-service HTTP, no Mongo/Redis,
# no per-service ports.
#
#   backend-go  Go unified backend (services/backend-go/cmd/backend):
#               bbolt store data/parlay.db, UDS socket
#               data/parlay-backend.sock. Spawns the persistent
#               yt-dlp daemon itself at boot (scripts/yt_dlp_worker.py
#               on the image's scripts/yt-dlp-venv python). No TCP
#               port; health = socket file present.
#   core-cpp    C++ core (services/core-cpp): dual TDLib sessions
#               (bot data/tdlib-bot, assistant data/tdlib), HTTP API
#               on :8080 (GET /healthz). Depends on backend-go healthy.
#   slskd       optional Soulseek daemon on :5030 (profile: full).
#               The backend reaches it at http://slskd:5030
#               (SLSKD_URL); the service is NOT started by a default
#               `docker compose up`.
#
# DATA: one shared volume (parlay-data, mounted at /data in both
# containers). Both processes MUST share PARLAY_DATA_DIR=/data: the
# socket path is <data_dir>/parlay-backend.sock on both sides, the
# store is <data_dir>/parlay.db, downloads go to
# <data_dir>/downloads, and the TDLib session dirs live under it.
#
# CONFIG: credentials come from .env (env_file, required — the core
# refuses to start without BOT_TOKEN). parlay.toml is NOT mounted by
# default (a missing file is not an error: the engine runs on
# defaults + env). To use one, add a compose override mounting it
# at /app/parlay.toml (ro) in both containers.
#
# Spotify OAuth: the redirect URI is http://127.0.0.1:8080/callback
# (SPOTIFY_REDIRECT_URI in .env); the callback is completed manually
# via the backend's spotify auth action — no local listener.
#
# Docker is NOT installed in the sandbox, so `docker compose up` has
# never run here; validate with `docker compose config` on a host
# with Docker before trusting it end to end.
#
# No secrets in this file: every credential comes from .env.
# Unset optional vars expand to empty via ${VAR:-}.

services:
  backend-go:
    build:
      context: .
      dockerfile: services/backend-go/Dockerfile
    env_file:
      - .env
    environment:
      - PARLAY_DATA_DIR=/data
      # slskd (opt-in): the backend talks to the slskd service when
      # it is up; with the default profile it is absent and Soulseek
      # answers engine_unavailable honestly.
      - SLSKD_URL=http://slskd:5030
      - SLSKD_USER=${SLSKD_SLSK_USERNAME:-}
      - SLSKD_PASS=${SLSKD_SLSK_PASSWORD:-}
    volumes:
      - parlay-data:/data
    healthcheck:
      test: ["CMD", "test", "-S", "/data/parlay-backend.sock"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  core-cpp:
    build:
      context: .
      dockerfile: services/core-cpp/Dockerfile
    env_file:
      - .env
    environment:
      - PARLAY_DATA_DIR=/data
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      backend-go:
        condition: service_healthy
    volumes:
      - parlay-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Soulseek daemon for the backend's Soulseek resolver.
  # Opt-in: only started with --profile full. No healthcheck: slskd
  # has no stable unauthenticated health endpoint to probe.
  slskd:
    image: slskd/slskd:latest
    environment:
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
    ports:
      - "5030:5030"   # web UI + API (SLSKD_URL), HTTP
      - "5031:5031"   # web UI, HTTPS
    volumes:
      - slskd-data:/app
    profiles: [full]

volumes:
  parlay-data:
  slskd-data:
